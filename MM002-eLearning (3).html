:root{
  color-scheme: light;
  --bg:#F5F6FB; --surface:#FFFFFF; --panel:#EEF0FA; --panel-2:#E3E6F7; --line:#DADDF0;
  --text:#171A36; --muted:#4C5275; --dim:#6E739C; --ink-2:#3A408A;
  --m1:#E0453F; --m2:#E3A21A; --m3:#11897E; --m4:#5E66DA; --m0:#8A8FB8; --amber:#F2B32C;
  --good:#11897E; --bad:#D23C36; --focus:#E3A21A; --pre:#6B72D9; --post:#0B9384;
  --display:"Alexandria","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --body:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){color-scheme:dark;
  --bg:#0E1024; --surface:#15183A; --panel:#1F2350; --panel-2:#282D63; --line:#343A78;
  --text:#EEF0FA; --muted:#AEB3DC; --dim:#8388B8; --ink-2:#5B61C9;
  --m1:#F0544F; --m2:#FFC145; --m3:#22B3A4; --m4:#8C92F0; --m0:#9DA2CF; --amber:#FFC145; --good:#22B3A4; --bad:#F0544F; --pre:#7A80E6; --post:#1E9E91;}}
:root[data-theme="dark"]{color-scheme:dark;
  --bg:#0E1024; --surface:#15183A; --panel:#1F2350; --panel-2:#282D63; --line:#343A78;
  --text:#EEF0FA; --muted:#AEB3DC; --dim:#8388B8; --ink-2:#5B61C9;
  --m1:#F0544F; --m2:#FFC145; --m3:#22B3A4; --m4:#8C92F0; --m0:#9DA2CF; --amber:#FFC145; --good:#22B3A4; --bad:#F0544F; --pre:#7A80E6; --post:#1E9E91;}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;overflow:hidden;background:var(--bg);color:var(--text);font-family:var(--body);font-size:17px;line-height:1.8}
button{font-family:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.app{display:grid;grid-template-columns:320px minmax(0,1fr);grid-template-rows:auto 1fr;height:100%}
/* top bar */
.top{grid-column:1/-1;display:flex;align-items:center;gap:16px;padding:12px 20px;padding-top:calc(12px + env(safe-area-inset-top,0px));background:var(--surface);border-bottom:1px solid var(--line)}
.top .code{font-family:var(--mono);font-size:13px;color:var(--dim);direction:ltr}
.top h1{font-family:var(--display);font-size:18px;margin:0;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prog{margin-inline-start:auto;display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted);white-space:nowrap}
.prog .track{width:160px;height:8px;border-radius:4px;background:var(--panel);overflow:hidden}
.prog .fill{height:100%;background:var(--m3);width:0;transition:width .4s}
.status{font-size:12px;font-weight:600;padding:3px 10px;border-radius:99px;background:var(--panel);color:var(--muted)}
.status.passed{background:color-mix(in srgb,var(--good) 18%,transparent);color:var(--good)}
.status.failed{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad)}
.menu-btn,.icon-btn{display:none;border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:8px;padding:6px 12px;font-size:14px;cursor:pointer}
.icon-btn{display:inline-block}
/* sidebar */
.side{background:var(--surface);border-inline-end:1px solid var(--line);overflow:auto;display:flex;flex-direction:column}
.toc{padding:14px 12px;flex:1}
.toc h4{font-family:var(--display);font-size:14px;margin:16px 10px 6px;display:flex;align-items:center;gap:8px;color:var(--text)}
.toc h4::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--c)}
.toc h4 small{font-family:var(--body);font-weight:500;color:var(--dim);font-size:12px;margin-inline-start:auto}
.toc button{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:right;background:none;border:0;padding:7px 10px;border-radius:8px;color:var(--muted);font-size:14.5px;line-height:1.5;cursor:pointer}
.toc button:hover{background:var(--panel)}
.toc button[aria-current="page"]{background:var(--panel-2);color:var(--text);font-weight:600}
.toc button .dot{flex:none;width:18px;height:18px;border-radius:50%;border:2px solid var(--line);margin-top:2px;display:grid;place-items:center;font-size:11px;color:#fff}
.toc button.seen .dot{background:var(--c);border-color:var(--c)}
.toc button.seen .dot::after{content:"✓"}
.toc .kind{font-size:11px;color:var(--dim);display:block}
/* partners */
.partners{background:#FFFFFF;border:1px solid #E4E6F2;border-radius:14px;padding:14px 18px;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:14px 26px;--lh:52px}
.partners img{height:var(--lh);width:auto;max-width:100%;object-fit:contain;display:block}
.partners img.eu{height:calc(var(--lh)*.66)}
.partners img.wide{height:calc(var(--lh)*.92)}
.partners-cap{font-size:12.5px;color:var(--dim);text-align:center;margin:0 0 8px}
.side .partners{--lh:34px;margin:10px 12px 14px;padding:12px;gap:10px 16px}
/* main */
main{overflow:auto;scroll-behavior:smooth;min-width:0}
.page{max-width:820px;margin:0 auto;padding:32px 28px 40px}
.phead{display:flex;align-items:center;gap:12px;flex-wrap:wrap;font-size:13.5px;color:var(--dim);margin-bottom:10px}
.chip{display:inline-flex;align-items:center;gap:8px;font-weight:600;color:var(--text)}
.chip::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--c)}
.phead .mins{margin-inline-start:auto}
.ptitle{font-family:var(--display);font-weight:800;font-size:34px;line-height:1.35;margin:0 0 20px;text-wrap:balance}
.content h3{font-family:var(--display);font-size:22px;font-weight:700;margin:34px 0 10px}
.content h4{font-family:var(--display);font-size:17px;margin:18px 0 6px}
.content p{margin:0 0 14px}
.content ul,.content ol{margin:0 0 16px;padding-inline-start:26px}
.content li{margin-bottom:6px}
.lead{font-size:20px;color:var(--muted);line-height:1.75}
.muted{color:var(--dim);font-size:15px}
.en{font-family:var(--mono);direction:ltr;unicode-bidi:isolate;font-size:.72em;letter-spacing:.05em;color:var(--dim);font-weight:500}
.mono{font-family:var(--mono);direction:ltr;unicode-bidi:isolate}
.content ol.nums{list-style:none;padding:0;counter-reset:n;display:flex;flex-direction:column;gap:10px}
.content ol.nums>li{counter-increment:n;display:block;position:relative;padding-inline-start:46px;margin:0;min-height:34px}
.content ol.nums>li::before{content:counter(n);position:absolute;inset-inline-start:0;top:1px;width:30px;height:30px;border-radius:50%;background:var(--c,var(--m1));color:#fff;font-family:var(--mono);font-weight:600;font-size:14px;display:grid;place-items:center}
.callout{background:var(--panel);border-radius:12px;padding:16px 20px;margin:20px 0;font-size:16px}
.callout b:first-child{display:block;font-family:var(--display);margin-bottom:4px}
.callout.tip{background:color-mix(in srgb,var(--m3) 12%,var(--surface))}
.callout.tip b:first-child{color:var(--m3)}
.callout.key{background:color-mix(in srgb,var(--c,var(--m1)) 11%,var(--surface))}
.callout.key b:first-child{color:var(--c,var(--m1))}
.callout.warn{background:color-mix(in srgb,var(--amber) 16%,var(--surface))}
.ex{background:var(--surface);border:1px dashed var(--line);border-radius:10px;padding:12px 16px;margin:10px 0 14px;font-weight:500}
.formula{font-family:var(--display);font-weight:700;font-size:19px;text-align:center;padding:14px;border-radius:12px;background:var(--panel-2);margin:12px 0}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin:18px 0}
.facts div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 16px}
.facts span{display:block;font-size:13px;color:var(--dim)}
.facts b{font-family:var(--display);font-size:17px}
.path{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:18px 0}
.path div{background:var(--c);color:#fff;border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;line-height:1.5}
.path span{font-size:12.5px;opacity:.9}
.path b{font-family:var(--display);font-size:16px}
.path em{font-style:normal;font-size:13px;opacity:.95}
.compare{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:14px 0 18px}
.compare>div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 18px}
.compare>div>b{font-family:var(--display);display:block;margin-bottom:6px}
.compare .good{border-color:color-mix(in srgb,var(--good) 55%,transparent);background:color-mix(in srgb,var(--good) 7%,var(--surface))}
.compare .bad{border-color:color-mix(in srgb,var(--bad) 45%,transparent);background:color-mix(in srgb,var(--bad) 6%,var(--surface))}
.compare ul{margin:0;padding-inline-start:20px}
.compare p{margin:0}
.cards2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 0 18px}
.cards3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:12px 0 18px}
.cards2>div,.cards3>div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 18px}
.cards2 b,.cards3 b{font-family:var(--display);display:block;font-size:17px}
.cards2 p,.cards3 p{margin:4px 0 0;font-size:15.5px;color:var(--muted)}
.cards3 .hi{border:2px solid var(--m1)}
.steps3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0 16px}
.steps3 div{background:var(--panel);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column}
.steps3 b{font-family:var(--display)} .steps3 span{font-size:14.5px;color:var(--muted)}
.tbl{width:100%;border-collapse:collapse;font-size:15.5px;margin:10px 0 18px;background:var(--surface);border-radius:12px;overflow:hidden}
.tbl th{background:var(--panel-2);font-family:var(--display);text-align:right;padding:10px 14px;font-weight:700}
.tbl td{padding:10px 14px;border-top:1px solid var(--line);vertical-align:top;line-height:1.6}
.scroll{overflow-x:auto;margin:10px 0 18px}
.scroll .tbl{margin:0;min-width:620px}
.fig{margin:16px 0 20px}
.fig figcaption,.figlabel{font-size:13.5px;color:var(--dim);margin:8px 0}
.tbar{display:flex;gap:3px;height:56px;border-radius:10px;overflow:hidden}
.tbar div{display:grid;place-items:center;color:#fff;font-family:var(--mono);font-weight:600;font-size:14px}
.pace{display:flex;gap:3px;height:34px;margin-bottom:10px}
.pace i{border-radius:4px;background:var(--m1)} .pace i:nth-child(even){background:color-mix(in srgb,var(--m1) 65%,#000)}
.pace.calm i{background:var(--m4)} .pace.calm i:nth-child(even){background:var(--ink-2)}
.shots{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:16px 0}
.shots figure{margin:0}
.frame{aspect-ratio:16/9;border-radius:10px;background:var(--panel-2);position:relative;overflow:hidden;max-width:100%;color:var(--text)}
.frame.light{background:#E3E5F5}
.frame svg{position:absolute;inset:0;width:100%;height:100%}
.shots figcaption{margin-top:8px;font-size:15px}
.anat{display:grid;grid-template-columns:1fr 1.1fr;gap:22px;align-items:start;margin:14px 0}
.panel{background:#F7F7FC;border:1px solid #DADDF0;border-radius:12px;padding:12px;color:#1A1B33}
.panel dl{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:10px 4px 2px;font-size:14px}
.panel dt{color:#5F6385}.panel dd{margin:0}
.thirds-wrap{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:center}
.thirds{position:relative;aspect-ratio:16/9;border-radius:12px;background:var(--panel-2);overflow:hidden;max-width:100%}
.thirds .v,.thirds .h{position:absolute;border:0 dashed var(--m4)}
.thirds .v{top:0;bottom:0;border-left-width:2px}.thirds .h{left:0;right:0;border-top-width:2px}
.thirds .pt{position:absolute;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;background:var(--amber)}
.thirds .subj{position:absolute;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;background:var(--m1)}
.light-wrap{display:grid;grid-template-columns:1fr 1.1fr;gap:20px;align-items:center}
.diagram{width:100%;height:auto;background:var(--panel);border-radius:12px;font-family:var(--body)}
.ease{display:flex;flex-direction:column;gap:12px;margin:16px 0}
.ease .track{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 18px;display:grid;grid-template-columns:1.4fr 1fr;gap:18px;align-items:center}
.ease .track p{margin:2px 0 0}
.lane{position:relative;height:40px;direction:ltr;margin:0 14px}
.lane::before{content:"";position:absolute;left:0;right:0;top:50%;border-top:2px dashed var(--line)}
.ghost{position:absolute;top:50%;width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:50%;background:var(--c);opacity:.4}
.ghost.key{background:var(--text);opacity:1;width:14px;height:14px;margin:-7px 0 0 -7px}
.ball{position:absolute;top:50%;left:0;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;background:var(--c)}
.ball.lin{animation:move 2.2s linear infinite alternate}
.ball.eas{animation:move 2.2s cubic-bezier(.65,0,.35,1) infinite alternate}
@keyframes move{from{left:0}to{left:100%}}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:14px 0 6px}
.stats div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.stats b{display:block;font-family:var(--display);font-size:24px;color:var(--m4)}
.stats span{font-size:14.5px;color:var(--muted);line-height:1.6;display:block}
.assess{display:flex;gap:28px;align-items:center;flex-wrap:wrap;margin:14px 0}
.donut{width:190px;height:190px;border-radius:50%;background:conic-gradient(var(--m4) 0 15%,var(--m3) 0 30%,var(--m1) 0 55%,var(--ink-2) 0 80%,var(--amber) 0 100%);position:relative;flex:none}
.donut::after{content:"";position:absolute;inset:44px;border-radius:50%;background:var(--bg)}
.donut span{position:absolute;inset:0;display:grid;place-items:center;z-index:1;font-family:var(--display);font-weight:800;font-size:28px}
.legend{display:grid;gap:8px;font-size:15.5px;flex:1;min-width:240px}
.legend div{display:grid;grid-template-columns:14px 1fr auto;gap:10px;align-items:center}
.legend i{width:14px;height:14px;border-radius:4px}
.legend b{font-family:var(--mono);direction:ltr}
.rubric td:first-child{white-space:nowrap}
/* interactions */
.tabs{margin:14px 0 20px;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.tablist{display:flex;flex-wrap:wrap;gap:4px;padding:8px;background:var(--panel)}
.tablist button{border:0;background:transparent;color:var(--muted);padding:8px 14px;border-radius:8px;font-size:15px;font-weight:600;cursor:pointer}
.tablist button[aria-selected="true"]{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.tabpanel{padding:16px 20px}
.tabpanel p:last-child{margin-bottom:0}
details.acc{background:var(--surface);border:1px solid var(--line);border-radius:10px;margin:8px 0;padding:0 16px}
details.acc summary{cursor:pointer;padding:12px 0;font-weight:600;font-family:var(--display);list-style:none;display:flex;justify-content:space-between;gap:12px}
details.acc summary::after{content:"+";font-family:var(--mono);color:var(--dim)}
details.acc[open] summary::after{content:"−"}
details.acc p{margin:0 0 14px;color:var(--muted)}
.ba{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin:12px 0 18px}
.ba span{display:block;font-size:13px;font-weight:600;color:var(--dim);margin-bottom:4px}
.ba-after{border-top:1px solid var(--line);margin-top:14px;padding-top:12px}
.ba-after p:first-of-type{font-family:var(--display);font-size:19px;font-weight:700}
.btn{border:0;background:var(--text);color:var(--bg);border-radius:10px;padding:10px 18px;font-size:15px;font-weight:600;cursor:pointer}
.btn.alt{background:var(--panel-2);color:var(--text)}
.btn:disabled{opacity:.45;cursor:default}
.ba-btn{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:8px;padding:8px 14px;font-weight:600;cursor:pointer}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 16px}
.chips button{border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:99px;padding:8px 14px;font-size:15px;cursor:pointer}
.chips button[aria-pressed="true"]{background:var(--m1);border-color:var(--m1);color:#fff}
.checklist{display:grid;gap:8px;margin:10px 0 18px}
.checklist label{display:flex;gap:10px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px;cursor:pointer;font-size:15.5px}
.checklist input{margin-top:6px;accent-color:var(--m3);width:17px;height:17px;flex:none}
.actcard{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
.actcard div{background:color-mix(in srgb,var(--amber) 16%,var(--surface));border-radius:10px;padding:10px 14px}
.actcard span{display:block;font-size:12.5px;color:var(--muted)} .actcard b{font-size:15px}
/* quiz */
.q{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin:14px 0}
.q h3{font-family:var(--display);font-size:18px;margin:0 0 12px;line-height:1.6}
.q h3 .n{font-family:var(--mono);color:var(--dim);font-size:14px;margin-inline-end:8px}
.opt{display:flex;gap:12px;align-items:flex-start;padding:10px 14px;border:1px solid var(--line);border-radius:10px;margin:8px 0;cursor:pointer;font-size:16px;line-height:1.6}
.opt input{margin-top:6px;accent-color:var(--m4);flex:none}
.opt .ol{font-weight:700;color:var(--dim);flex:none;min-width:1.4em}
.opt.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 10%,var(--surface))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 8%,var(--surface))}
.fb{margin-top:10px;font-size:15.5px;padding:10px 14px;border-radius:10px;background:var(--panel)}
.fb b{display:block}
.fb.ok b{color:var(--good)} .fb.no b{color:var(--bad)}
.qactions{display:flex;gap:10px;align-items:center;margin-top:12px;flex-wrap:wrap}
.result{border-radius:14px;padding:20px 22px;margin:18px 0;background:var(--panel)}
.result.pass{background:color-mix(in srgb,var(--good) 14%,var(--surface))}
.result.fail{background:color-mix(in srgb,var(--bad) 10%,var(--surface))}
.result .big{font-family:var(--display);font-size:40px;font-weight:800;line-height:1.2}
.thanks{font-family:var(--display);font-size:22px;font-weight:700;margin-top:28px}
.thanks span{font-family:var(--body);font-size:15px;font-weight:500;color:var(--dim)}
.qmod{display:block;font-family:var(--body);font-size:12.5px;font-weight:600;color:var(--dim);margin-bottom:2px}
.lv{display:inline-block;font-size:13px;font-weight:700;padding:2px 10px;border-radius:99px;font-family:var(--body)}
.lv.lo{background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad)}
.lv.mid{background:color-mix(in srgb,var(--amber) 22%,transparent);color:var(--text)}
.lv.hi{background:color-mix(in srgb,var(--good) 16%,transparent);color:var(--good)}
.mods{display:grid;gap:12px;margin:10px 0 16px}
.mrow{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 16px}
.mname{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px}
.mname b{font-family:var(--display)}
.bar-row{display:grid;grid-template-columns:44px 1fr 48px;gap:10px;align-items:center;margin:4px 0}
.bl{font-size:13px;color:var(--dim)}
.bt{height:14px;background:var(--panel);border-radius:4px;overflow:hidden}
.bf{height:100%;border-radius:4px 0 0 4px;transition:width .6s}
.bf.pre{background:var(--pre)} .bf.post{background:var(--post)}
.bv{font-size:13.5px;color:var(--text);text-align:left}
.adv{margin:8px 0 0!important;font-size:14.5px;color:var(--muted)}
.delta{font-size:13px;font-weight:600;padding:2px 8px;border-radius:99px}
.delta.up{background:color-mix(in srgb,var(--good) 16%,transparent);color:var(--good)}
.delta.down{background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad)}
.legend2{display:flex;gap:18px;font-size:13.5px;color:var(--muted)}
.legend2 i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-inline-end:6px;vertical-align:-1px}
.legend2 i.pre{background:var(--pre)} .legend2 i.post{background:var(--post)}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0}
.kpis div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.kpis span{display:block;font-size:13px;color:var(--dim)}
.kpis b{font-family:var(--display);font-size:26px}
.kpis small{display:block;font-size:12px;color:var(--dim);line-height:1.4}
@media (max-width:640px){.kpis{grid-template-columns:1fr 1fr}}
/* nav */
.pnav{display:flex;justify-content:space-between;align-items:center;gap:12px;border-top:1px solid var(--line);margin-top:34px;padding-top:18px}
.pnav .count{font-family:var(--mono);color:var(--dim);font-size:13px;direction:ltr}
.welcome-partners{margin:6px 0 24px}
@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{visibility:hidden}.side.open{visibility:visible}
  .side{position:fixed;inset:0 0 0 auto;width:min(340px,88vw);z-index:20;transform:translateX(100%);transition:transform .25s;box-shadow:0 0 40px rgba(0,0,0,.25);padding-top:env(safe-area-inset-top,0px)}
  .side.open{transform:none}
  .menu-btn{display:inline-block}
  .prog .track{width:80px}
  .top h1{font-size:15px}
}
@media (max-width:640px){
  body{font-size:16px}
  .page{padding:22px 16px 32px}
  .ptitle{font-size:26px}
  .compare,.cards2,.cards3,.steps3,.shots,.anat,.thirds-wrap,.light-wrap,.stats,.actcard{grid-template-columns:1fr}
  .path{grid-template-columns:1fr 1fr}
  .ease .track{grid-template-columns:1fr}
  .top .code,.prog .lbl{display:none}
  .partners{--lh:40px}
}
@media (prefers-reduced-motion:reduce){.ball{animation:none!important}.side,.prog .fill{transition:none}main{scroll-behavior:auto}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <button class="menu-btn" id="menuBtn" aria-expanded="false" aria-controls="side">المحتويات</button>
    <span class="code">MM002</span>
    <h1>إنتاج الفيديو والموشن جرافيك</h1>
    <div class="prog"><span class="lbl">التقدم</span><div class="track"><div class="fill" id="progFill"></div></div><span id="progTxt" class="mono">0%</span><span class="status" id="status">قيد التعلّم</span></div>
  </header>
  <nav class="side" id="side" aria-label="محتويات المساق">
    <div class="toc" id="toc"></div>
    <div class="partners" id="sidePartners"></div>
  </nav>
  <main id="main"><article class="page" id="page"></article></main>

</div>

P({ m: 1, t: 'بنية السيناريو: مقدمة، تطوّر، خاتمة', min: 7, h: `
<p class="lead">كل فيديو قصير ناجح، مهما كان موضوعه، يمر بثلاث مراحل. الفرق أن الفيديو القصير يضغطها في ثوانٍ معدودة.</p>
<figure class="fig">
  <div class="tbar"><div style="flex:5;background:var(--m1)">0–5</div><div style="flex:40;background:var(--ink-2)">5–45</div><div style="flex:15;background:var(--amber);color:#1A1B33">45–60</div></div>
  <figcaption>توزيع زمني نموذجي لفيديو مدته 60 ثانية. عرض كل جزء يمثّل مدته الحقيقية.</figcaption>
</figure>
<h3>1. المقدمة: الخطّاف (0 – 5 ثوانٍ)</h3>
<p>مهمتها الوحيدة أن تمنع المشاهد من التمرير. لاحظي كم هي قصيرة في الشريط أعلاه: خمس ثوانٍ فقط من ستين، لكنها تحدد إن كان أحد سيشاهد الخمس والخمسين الباقية. لا تبدئي بالترحيب، ولا بشعار طويل، ولا بعبارة «في هذا الفيديو سنتحدث عن…». ابدئي مباشرة بما يثير الفضول.</p>
<h3>2. التطوّر: الرسالة (5 – 45 ثانية)</h3>
<p>هنا تقدّمين المحتوى الفعلي. أبسط بنية وأكثرها استخدامًا في الفيديو التسويقي والتوعوي هي:</p>
<div class="steps3"><div><b>المشكلة</b><span>ما الذي يعاني منه المشاهد أو يحتاجه؟</span></div><div><b>الحل</b><span>كيف يحل المنتج أو الفكرة هذه المشكلة؟</span></div><div><b>الفائدة</b><span>كيف ستتحسن حياة المشاهد بعد ذلك؟</span></div></div>
<p>لاحظي أن الفائدة ليست الميزة. الميزة: «الحقيبة مطرّزة يدويًا». الفائدة: «قطعة لا تشبه ما تحمله أي فتاة أخرى». المشاهد يهتم بالفائدة.</p>
<p>الأهم في هذا الجزء أن يتصاعد: كل مشهد يضيف شيئًا جديدًا، ولا يكرر ما قبله.</p>
<h3>3. الخاتمة: الدعوة إلى الإجراء (45 – 60 ثانية)</h3>
<p>بعد أن اقتنع المشاهد، أخبريه بوضوح ماذا يفعل الآن: اطلبي، تابعي، سجّلي، زوري الرابط. فيديو بلا دعوة إلى الإجراء يشبه بائعة أقنعت الزبونة ثم لم تخبرها أين تدفع.</p>
<h3>كم كلمة أحتاج؟</h3>
<p>التعليق الصوتي المريح بالعربية يقارب كلمتين في الثانية تقريبًا. هذا يعني:</p>
<table class="tbl"><thead><tr><th>مدة الفيديو</th><th>عدد كلمات التعليق التقريبي</th></tr></thead><tbody><tr><td class="mono">30 ثانية</td><td>50 – 60 كلمة</td></tr><tr><td class="mono">60 ثانية</td><td>100 – 120 كلمة</td></tr><tr><td class="mono">90 ثانية</td><td>150 – 180 كلمة</td></tr></tbody></table>
<p>في الموشن جرافيك، كثيرًا ما تحمل الرسوم والنصوص على الشاشة جزءًا من الرسالة، فتحتاجين كلمات أقل. وسرعة الكلام تختلف من شخص لآخر: اقرئي نصًا عاديًا لمدة 10 ثوانٍ وعدّي كلماتك لتعرفي سرعتك الخاصة.</p>
`});

P({ m: 1, t: 'الخطّاف: خمسة أنواع مجرّبة', min: 6, h: `
<p class="lead">الخطّاف هو أول جملة أو أول صورة في الفيديو. كتابته مهارة يمكن تعلّمها، وهذه أكثر أنواعه استخدامًا. اضغطي على كل نوع لتري شرحه وأمثلة عليه.</p>

  <div class="tabpanel" hidden><p>إخبار المشاهد بما سيحصل عليه إذا أكمل. يجب أن يفي الفيديو بالوعد فعلًا.</p><div class="ex">«خلال دقيقة، ستعرفين كيف تضيئين وجهك بضوء النافذة فقط.»<br>«ثلاث خطوات تجعل فيديوهاتك تبدو احترافية.»</div></div>
</div>
<h3>كيف تختارين الخطّاف المناسب؟</h3>
<ul>
  <li><b>للمنتجات:</b> المشهد اللافت أو المشكلة المألوفة.</li>
  <li><b>للتوعية والتعليم:</b> السؤال أو المعلومة المفاجئة أو الوعد بنتيجة.</li>
  <li><b>للقصص الإنسانية:</b> مشهد لافت يضعنا في قلب اللحظة.</li>
</ul>
<div class="callout tip"><b>اكتبي أكثر من خطّاف</b>المحترفون يكتبون 3 – 5 خطّافات لكل فيديو ثم يختارون الأقوى. اكتبي خطّافين على الأقل بنوعين مختلفين، واقرئيهما على صديقة: أيهما جعلها تسأل «ثم ماذا؟»</div>
`});

P({ m: 1, t: 'الرسالة والجمهور والدعوة إلى الإجراء', min: 6, h: `
<p class="lead">قبل كتابة أي جملة، أجيبي عن سؤالين: ماذا أريد أن يتذكر المشاهد؟ ومن هو هذا المشاهد؟</p>
<h3>الرسالة الأساسية</h3>
<p>الرسالة الأساسية جملة واحدة تلخّص الفيديو كله. إن لم تستطيعي كتابتها في جملة واحدة، فالفكرة ما زالت غير واضحة في ذهنك، وستكون أقل وضوحًا عند المشاهد.</p>
<div class="formula">[المنتج / الفكرة] يساعد [الجمهور] على [النتيجة]</div>
<div class="ex">«مشروع غُرزة يقدّم للفتيات قطعًا مطرّزة يدويًا تجمع التراث والأناقة اليومية.»</div>
<h3>الجمهور</h3>
<p>«الجميع» ليس جمهورًا. كلما حدّدتِ الجمهور بدقة، أصبحت كتابتك أدق. اسألي:</p>
<ul><li>كم عمره تقريبًا؟ وما اهتماماته؟</li><li>على أي منصة سيشاهد الفيديو؟ وفي أي لحظة من يومه؟</li><li>ما اللغة التي يتحدث بها: فصحى بسيطة أم لهجة محلية؟ رسمية أم ودّية؟</li></ul>
<p>فيديو لطالبات جامعيات على إنستغرام يختلف في إيقاعه ولغته عن فيديو لأصحاب الشركات على لينكدإن، حتى لو كان المنتج واحدًا.</p>
<h3>الدعوة إلى الإجراء (CTA)</h3>
<p>الدعوة الفعّالة تجمع ثلاثة عناصر:</p>
<ol class="nums"><li><b>فعل واحد واضح بصيغة أمر:</b> «اطلبي»، «احجزي»، «تابعينا». لا تطلبي ثلاثة أشياء في الوقت نفسه.</li><li><b>سبب أو فائدة:</b> «…لتحصلي على خصم الافتتاح»، «…حتى لا تفوتك الحلقة القادمة».</li><li><b>ظهور مزدوج:</b> نص متحرك على الشاشة، وجملة في التعليق الصوتي، لأن كثيرًا من المشاهدين يشاهدون دون صوت.</li></ol>
<div class="compare"><div class="bad"><b>دعوة ضعيفة</b><p>«تابعونا وشاركوا الفيديو واتركوا تعليقًا وزوروا موقعنا.»</p></div><div class="good"><b>دعوة قوية</b><p>«اطلبي قطعتك الآن من الرابط في الوصف. الكمية محدودة.»</p></div></div>
`});

P({ m: 1, t: 'قالب السكريبت: الصورة والصوت', min: 8, h: `
<p class="lead">السكريبت الاحترافي للفيديو القصير يُكتب في جدول من عمودين: ماذا نرى، وماذا نسمع. هذا القالب يجبرك على التفكير بصريًا منذ اللحظة الأولى.</p>
<p>إليكِ سكريبتًا كاملًا لإعلان مدته 60 ثانية لمشروع تطريز يدوي افتراضي اسمه «غُرزة». اقرئيه بتمعّن، فسنستخدمه مثالًا في بقية المساق.</p>
<div class="scroll"><table class="tbl script">
<thead><tr><th>الزمن</th><th>الصورة (ماذا نرى؟)</th><th>الصوت / النص (ماذا نسمع ونقرأ؟)</th></tr></thead>
<tbody>
<tr><td class="mono">0:00–0:05</td><td>لقطة قريبة جدًا: إبرة تعبر القماش ببطء، مع صوت الغرزة واضحًا.</td><td>نص على الشاشة: «كل غرزة… حكاية». لا تعليق صوتي.</td></tr>
<tr><td class="mono">0:05–0:20</td><td>لقطة متوسطة ليدين تطرّزان، ثم لقطة واسعة للورشة وفيها ثلاث نساء يعملن.</td><td>تعليق: «في ورشة صغيرة، تصنع نساء المدينة قطعًا لا تتكرر.» موسيقى هادئة تبدأ.</td></tr>
<tr><td class="mono">0:20–0:40</td><td>موشن جرافيك: نقش تطريز يُرسم خطًا بخط، ثم يتحرك ويتحول تدريجيًا إلى حقيبة، ثم شال، ثم محفظة.</td><td>تعليق: «نقوش ورثناها عن جدّاتنا… بتصاميم تناسب يومك.» الموسيقى ترتفع قليلًا.</td></tr>
<tr><td class="mono">0:40–0:52</td><td>لقطات علوية للمنتجات على طاولة خشبية، والأسعار تظهر بحركة ناعمة بجانب كل قطعة.</td><td>تعليق: «كل قطعة مصنوعة يدويًا، ومغلّفة بعناية.»</td></tr>
<tr><td class="mono">0:52–1:00</td><td>الشعار في المنتصف، ثم رابط المتجر، ثم زر «اطلبي الآن» ينبض مرة واحدة.</td><td>تعليق ونص: «اطلبي قطعتك الآن من الرابط.»</td></tr>
</tbody></table></div>
<h3>ماذا نتعلم من هذا المثال؟</h3>
<details class="acc"><summary>أين الخطّاف؟ ومن أي نوع هو؟</summary><p>في أول 5 ثوانٍ: لقطة الإبرة القريبة جدًا مع صوت الغرزة. إنه «مشهد لافت» مدعوم بنص قصير. لاحظي أنه لا يوجد تعليق صوتي في البداية، فالصورة والصوت الطبيعي يكفيان.</p></details>
<details class="acc"><summary>أين المشكلة والحل والفائدة؟</summary><p>المشكلة ضمنية: البحث عن قطعة مميزة لا تتكرر. الحل: قطع مطرّزة يدويًا في ورشة محلية. الفائدة: تراث أصيل بتصاميم تناسب الحياة اليومية، ومصنوع ومغلّف بعناية.</p></details>
<details class="acc"><summary>لماذا لا يكرر التعليق ما نراه؟</summary><p>الصورة تُظهر يدين تطرّزان، والتعليق لا يقول «يدان تطرّزان»، بل يضيف معلومة جديدة: «نساء المدينة»، «قطع لا تتكرر». الصورة والصوت يتكاملان ولا يتكرران.</p></details>
<details class="acc"><summary>أين دور الموشن جرافيك؟</summary><p>في المقطع الأوسط (0:20 – 0:40) يتحول النقش إلى منتجات. هذه فكرة يستحيل تصويرها بالكاميرا، لكن الموشن يجعلها ممكنة وجذابة. وفي الخاتمة: ظهور الأسعار والشعار والزر بحركة. هذا هو «الأسلوب الهجين» الذي ستتعلمينه في الوحدة الرابعة.</p></details>
<h3>أخطاء شائعة في السكريبت</h3>
<ul><li>عمود «الصورة» فارغ أو مكتوب فيه «صور عامة»: كل صف يحتاج وصفًا محددًا لما سنراه.</li><li>تعليق صوتي في كل ثانية: اتركي مساحات للموسيقى والصورة لتتنفس.</li><li>خاتمة بلا دعوة إلى الإجراء، أو بدعوات متعددة.</li><li>مجموع الأزمنة لا يطابق طول الفيديو المطلوب.</li></ul>
`});

<h3>الخطوات</h3>

<h3>الأحجام الثلاثة الأساسية</h3>
<p><b>اللقطة الواسعة (Wide Shot):</b> تُظهر الشخص كاملًا مع المكان من حوله. وظيفتها أن تخبر المشاهد: أين نحن؟ تُستخدم غالبًا في بداية المشهد لتحديد الموقع، ولذلك تسمى أحيانًا «لقطة تأسيسية». في مثال «غُرزة»: اللقطة الواسعة للورشة وفيها النساء يعملن.</p>
<p><b>اللقطة المتوسطة (Medium Shot):</b> تُظهر الشخص من الخصر تقريبًا إلى الرأس. هي أقرب ما يكون إلى المسافة الطبيعية بين شخصين يتحدثان، ولذلك تُستخدم للحوار والشرح والمقابلات والأفعال اليومية.</p>
<p><b>اللقطة القريبة (Close-up):</b> تملأ الإطار بالوجه أو بتفصيل صغير. وظيفتها المشاعر والتفاصيل: دمعة، ابتسامة، ملمس القماش، إبرة تعبر الخيط. هي اللقطة التي تجعل المشاهد «يشعر».</p>

<tr><td>متوسطة قريبة <span class="en">MCU</span></td><td>من الصدر إلى الرأس</td><td>المقابلات والتحدث إلى الكاميرا</td></tr>

<div class="callout key"><b>قاعدة التنويع</b>التنويع بين الأحجام هو ما يصنع إيقاع الفيديو. تسلسل شائع وفعّال: واسعة (أين نحن؟) ← متوسطة (من هنا؟ وماذا يفعل؟) ← قريبة (ماذا يشعر؟ وما التفاصيل؟).</div>

P({ m: 3, t: 'من الورق إلى الكاميرا: دور المخرجة', min: 5, h: `
<p class="lead">عندك الآن سكريبت وستوري بورد. في هذه الوحدة تصبحين المخرجة: من تحوّل الإطارات المرسومة إلى لقطات حقيقية.</p>
<p>الإخراج ليس الضغط على زر التسجيل. المخرجة تتخذ قرارات واعية لكل لقطة: أين يقف الشخص؟ من أين ننظر إليه؟ من أين يأتي الضوء؟ كم تستمر اللقطة؟ كل قرار من هذه يغيّر ما يشعر به المشاهد، حتى لو لم يلاحظ السبب.</p>
<h3>أربعة قرارات في كل لقطة</h3>
<div class="cards2">
  <div><b>التكوين</b><p>أين نضع العناصر داخل الإطار؟ وما الذي نُبقيه أو نحذفه منه؟</p></div>
  <div><b>الزاوية</b><p>من أين تنظر الكاميرا؟ من الأعلى، من الأسفل، أم من مستوى العين؟</p></div>
  <div><b>الإضاءة</b><p>من أين يأتي الضوء؟ وهل هو ناعم أم قاسٍ؟ دافئ أم بارد؟</p></div>
  <div><b>الإيقاع</b><p>كم تستمر اللقطة؟ وما سرعة الانتقال بين اللقطات؟</p></div>
</div>
<p>هذه القرارات الأربعة لا تخص التصوير الحي فقط. في الموشن جرافيك تتخذين القرارات نفسها: أين يقف العنصر في الإطار، ومن أي «زاوية» نراه، وكيف تُضاء الألوان والظلال، وبأي إيقاع يتحرك. لذلك حتى لو كان مشروعك موشن بالكامل، فهذه الوحدة لك.</p>
<div class="callout tip"><b>قبل أن تكملي</b>افتحي كاميرا هاتفك الآن، وادخلي إلى الإعدادات، وفعّلي خيار «الشبكة» (Grid). ستظهر على الشاشة خطوط ستحتاجينها في الصفحة التالية.</div>
`});

P({ m: 3, t: 'التكوين البصري وقاعدة الأثلاث', min: 8, h: `
<p class="lead">التكوين (Composition) هو ترتيب العناصر داخل الإطار. التكوين الجيد يقود عين المشاهد إلى ما تريدين أن يراه، دون أن يشعر.</p>
<h3>قاعدة الأثلاث</h3>
<div class="thirds-wrap">
  <div class="thirds" aria-label="إطار مقسم إلى أثلاث مع العنصر عند نقطة تقاطع">
    <span class="v" style="left:33.33%"></span><span class="v" style="left:66.66%"></span><span class="h" style="top:33.33%"></span><span class="h" style="top:66.66%"></span>
    <span class="pt" style="left:33.33%;top:33.33%"></span><span class="pt" style="left:33.33%;top:66.66%"></span><span class="pt" style="left:66.66%;top:66.66%"></span><span class="subj" style="left:66.66%;top:33.33%"></span>
  </div>
  <div><p>قسّمي الإطار بخطين أفقيين وخطين عموديين إلى تسعة أجزاء متساوية، وهي الخطوط التي تظهر عند تفعيل الشبكة في الكاميرا. نقاط التقاطع الأربع هي أقوى مواضع الإطار.</p><p><b>القاعدة:</b> ضعي العنصر المهم، مثل العينين أو المنتج، على إحدى نقاط التقاطع بدل المنتصف تمامًا. النتيجة صورة أكثر حيوية وتوازنًا.</p></div>
</div>
<h3>مبادئ أخرى في التكوين</h3>
<details class="acc" open><summary>مساحة النظر والحركة</summary><p>إذا كان الشخص ينظر إلى اليسار، اتركي مساحة فارغة أمام وجهه في جهة اليسار. وإذا كان يتحرك، اتركي مساحة في اتجاه حركته. الشخص الذي «يصطدم» بحافة الإطار يُشعر المشاهد بالضيق.</p></details>
<details class="acc"><summary>خط الأفق</summary><p>ضعي الأفق على أحد الخطين الأفقيين، لا في المنتصف. الأفق على الخط السفلي يعطي مساحة للسماء ويناسب المشاهد الواسعة، وعلى الخط العلوي يعطي مساحة للأرض والتفاصيل. وتأكدي أنه مستقيم دائمًا؛ الأفق المائل دون قصد أول ما يكشف ضعف التصوير.</p></details>
<details class="acc"><summary>الخطوط الموجِّهة</summary><p>الطرق والممرات وحواف الطاولات والأسوار كلها خطوط تقود العين. ضعيها بحيث تتجه نحو العنصر المهم، فتصل عين المشاهد إليه تلقائيًا.</p></details>
<details class="acc"><summary>البساطة والخلفية</summary><p>كل ما في الإطار إما يخدم الرسالة أو يشتت عنها. قبل التصوير، انظري إلى الخلفية: هل فيها أسلاك، أو أكياس، أو أشخاص يمرّون؟ حرّكي الكاميرا أو العنصر، أو أزيلي ما يشتت.</p></details>
<details class="acc"><summary>العمق</summary><p>الصورة المسطحة مملة. أضيفي طبقات: شيء قريب من الكاميرا (مقدمة)، والعنصر الأساسي (الوسط)، وخلفية. مثلًا: صوّري اليدين وهما تطرّزان، وفي المقدمة طرف قماش خارج التركيز.</p></details>
<details class="acc"><summary>متى نكسر القاعدة؟</summary><p>التناظر المقصود، أي وضع العنصر في المنتصف تمامًا، يناسب المنتجات والعمارة والمشاهد التي تريدين أن تبدو هادئة ورسمية. المهم أن يكون موضع العنصر قرارًا واعيًا لا صدفة.</p></details>
<h3>التكوين في الموشن جرافيك</h3>
<p>القواعد نفسها تحدد مكان النص والشعار والعناصر في فيديو الموشن. العنوان على الخط العلوي، والعنصر المتحرك عند نقطة تقاطع، والمساحة الفارغة تمنح التصميم فخامته.</p>
<div class="callout warn"><b>المنطقة الآمنة في الفيديو العمودي</b>في ريلز وتيك توك تغطي أزرار التطبيق ونص الوصف أسفل الشاشة وجانبها. أبقي النصوص والعناصر المهمة بعيدة عن الحواف، وخاصة عن الجزء السفلي من الشاشة.</div>
`});

P({ m: 3, t: 'أساسيات الإضاءة', min: 9, h: `
<p class="lead">الكاميرا لا تصوّر الأشياء، بل تصوّر الضوء الساقط عليها. الإضاءة الجيدة هي أسرع طريقة لجعل فيديو الهاتف يبدو احترافيًا.</p>
<h3>ثلاث خصائص للضوء</h3>
<p><b>1. الجودة: ناعم أم قاسٍ؟</b> الضوء القاسي يأتي من مصدر صغير ومباشر، مثل الشمس في الظهيرة أو مصباح عارٍ، ويصنع ظلالًا حادة وواضحة. الضوء الناعم يأتي من مصدر كبير أو منتشر، مثل نافذة بستارة خفيفة أو يوم غائم، ويصنع ظلالًا متدرجة. للوجوه والمنتجات، الضوء الناعم هو الأجمل غالبًا.</p>
<p><b>2. الاتجاه: من أين يأتي؟</b> الضوء من الأمام يُسطّح الوجه، ومن الجانب يُظهر الملامح والملمس، ومن الخلف يفصل الشخص عن الخلفية. أما الضوء من الأعلى مباشرة فيصنع ظلالًا داكنة تحت العينين، فتجنّبيه.</p>
<p><b>3. اللون: دافئ أم بارد؟</b> لكل ضوء «حرارة لونية» تقاس بالكلفن. ضوء المصابيح المنزلية الصفراء دافئ (نحو 3200 كلفن)، وضوء النهار أبيض مائل للزرقة (نحو 5600 كلفن). لا تخلطي النوعين في اللقطة نفسها، وإلا ظهر نصف الوجه برتقاليًا ونصفه أزرق.</p>

<h3>الإضاءة الثلاثية بالهاتف ودون معدات</h3>
<ol class="nums"><li><b>النافذة إضاءتك الرئيسية:</b> ضعي الشخص بجانب نافذة، بحيث يأتي الضوء على وجهه من الجانب بزاوية، لا من الخلف.</li><li><b>ورقة بيضاء أو كرتونة هي المالئة:</b> ضعيها في الجهة المقابلة للنافذة لتعكس الضوء على الجانب المظلم من الوجه.</li><li><b>مصباح منزلي صغير هو الخلفية:</b> ضعيه خلف الشخص بعيدًا عن الكاميرا. هذه الخطوة اختيارية.</li></ol>

<p><b>القطع على الإيقاع:</b> اجعلي الانتقال بين اللقطات يقع على ضربات الموسيقى. المشاهد يشعر بالتناغم حتى لو لم ينتبه إليه.</p>

P({ m: 4, t: 'ما هو الموشن جرافيك؟', min: 6, h: `
<p class="lead">الموشن جرافيك تصميم يتحرك: نصوص وأشكال ورسوم وأيقونات تتحرك وفق خطة لتنقل فكرة أو رسالة.</p>
<p>ستجدينه في كل مكان: مقدمات البرامج، والإعلانات، وفيديوهات الشرح، والعناوين المتحركة في الريلز، والإنفوغرافيك المتحرك، وشعارات الشركات عندما تظهر بحركة. ما يميزه أنه يستطيع أن يُظهر ما لا تستطيع الكاميرا تصويره: فكرة مجردة، رقمًا يكبر، خريطة، أو نقشًا يتحول إلى منتج.</p>
<h3>ثلاثة أساليب</h3>
<div class="cards3">
  <div><span class="en">LIVE ACTION</span><b>الفيديو الحي</b><p>لقطات مصوّرة لأشخاص وأماكن حقيقية.</p><p class="muted">الأنسب للقصص الإنسانية، والمقابلات، وإظهار المنتج أثناء الاستخدام.</p></div>
  <div><span class="en">MOTION GRAPHICS</span><b>الموشن جرافيك</b><p>رسومات ونصوص وأشكال متحركة بالكامل.</p><p class="muted">الأنسب لشرح الأفكار المجردة، والأرقام والبيانات، والهوية البصرية.</p></div>
  <div class="hi"><span class="en">HYBRID</span><b>الأسلوب الهجين</b><p>لقطات حية تُضاف إليها نصوص وعناصر متحركة.</p><p class="muted">الأنسب لمعظم محتوى المنصات اليوم، ولمشروع التخرج في هذا المساق.</p></div>
</div>
<h3>ما الذي يجعل الموشن «احترافيًا»؟</h3>
<p>الفرق بين موشن المبتدئين وموشن المحترفين ليس في كثرة التأثيرات، بل في ثلاثة أشياء ستتعلمينها في هذه الوحدة:</p>
<ol class="nums"><li><b>الحركة الناعمة:</b> العناصر تبدأ وتتوقف بشكل طبيعي، لا فجأة.</li><li><b>التوقيت المدروس:</b> كل حركة تستغرق الوقت المناسب، والعناصر لا تتحرك كلها معًا.</li><li><b>الانتقالات المتسقة:</b> أسلوب انتقال واضح يتكرر، لا استعراض لكل الانتقالات المتاحة.</li></ol>
<div class="callout key"><b>عن مشروع التخرج</b>المطلوب فيديو «بأسلوب الموشن الاحترافي». يمكن أن يكون موشن بالكامل أو هجينًا، بشرط أن يطبّق مبادئ الحركة والتوقيت والانتقالات التي ستتعلمينها الآن.</div>
`});

P({ m: 4, t: 'الإطارات المفتاحية: كيف نصنع الحركة', min: 7, h: `
<p class="lead">كل حركة في الموشن جرافيك، من أبسط نص يدخل الشاشة إلى أعقد مشهد، مبنية على فكرة واحدة: الإطار المفتاحي.</p>
<p>الفيديو سلسلة من الصور الثابتة (الإطارات) تُعرض بسرعة، 25 أو 30 صورة في الثانية، فتبدو متحركة. في الموشن جرافيك لا ترسمين كل إطار بنفسك. بدلًا من ذلك، تحددين نقاطًا مهمة فقط، والبرنامج يحسب ما بينها.</p>
<div class="callout key"><b>الإطار المفتاحي (Keyframe)</b>نقطة زمنية تحددين عندها قيمة معينة لخاصية ما. عندما تضعين إطارين مفتاحيين بقيمتين مختلفتين، يحسب البرنامج كل الإطارات بينهما تلقائيًا، فتنشأ الحركة.</div>
<h3>مثال</h3>
<p>تريدين أن يدخل عنوان من يمين الشاشة إلى منتصفها خلال نصف ثانية:</p>
<ol class="nums"><li>عند الثانية <span class="mono">0:00</span>، ضعي إطارًا مفتاحيًا للموقع، والعنوان خارج الشاشة من اليمين.</li><li>عند الثانية <span class="mono">0:15</span> (نصف ثانية بمعدل 30 إطارًا)، ضعي إطارًا مفتاحيًا ثانيًا، والعنوان في المنتصف.</li><li>البرنامج يرسم كل المواقع بينهما، فيتحرك العنوان.</li></ol>
<h3>الخصائص التي نحرّكها</h3>
<table class="tbl"><thead><tr><th>الخاصية</th><th>ماذا تغيّر؟</th><th>استخدام شائع</th></tr></thead><tbody>
<tr><td><b>الموقع</b> <span class="en">Position</span></td><td>مكان العنصر على الشاشة</td><td>دخول وخروج النصوص والعناصر</td></tr>
<tr><td><b>الحجم</b> <span class="en">Scale</span></td><td>تكبير وتصغير</td><td>ظهور الشعار، نبض الزر، التركيز على عنصر</td></tr>
<tr><td><b>الدوران</b> <span class="en">Rotation</span></td><td>زاوية العنصر</td><td>أيقونات، أشكال، عجلات</td></tr>
<tr><td><b>الشفافية</b> <span class="en">Opacity</span></td><td>ظهور واختفاء تدريجي</td><td>التلاشي، الانتقالات الناعمة</td></tr>
<tr><td><b>نقطة الارتكاز</b> <span class="en">Anchor Point</span></td><td>النقطة التي يدور أو يكبر حولها العنصر</td><td>باب يُفتح من جانبه، عقرب ساعة</td></tr>
</tbody></table>
<p>يمكنك تحريك أكثر من خاصية في الوقت نفسه. مثلًا: عنصر يدخل من الأسفل (الموقع) وهو يظهر تدريجيًا (الشفافية) ويكبر قليلًا (الحجم). الجمع بين حركتين أو ثلاث بسيطة يعطي نتيجة أغنى من حركة واحدة معقدة.</p>
`});

P({ m: 4, t: 'التسارع والتباطؤ: سر الحركة الطبيعية', min: 7, h: `
<p class="lead">بين إطارين مفتاحيين، هل يتحرك العنصر بسرعة ثابتة؟ أم يتسارع ثم يتباطأ؟ هذا الفرق وحده يحوّل الحركة من آلية إلى احترافية.</p>
<div class="ease">
  <div class="track" style="--c:var(--m4)"><div class="lane" data-ease="lin"><span class="ball lin"></span></div><div><b>حركة خطية</b> <span class="en">LINEAR</span><p class="muted">سرعة ثابتة من البداية للنهاية. تبدو آلية وجامدة.</p></div></div>
  <div class="track" style="--c:var(--m1)"><div class="lane" data-ease="eas"><span class="ball eas"></span></div><div><b>تسارع وتباطؤ</b> <span class="en">EASE IN / OUT</span><p class="muted">تبدأ ببطء، وتتسارع، ثم تهدأ قبل التوقف. تبدو طبيعية.</p></div></div>
  <p class="figlabel">النقاط الباهتة مواقع العنصر في إطارات زمنية متساوية. النقطتان الداكنتان هما الإطاران المفتاحيان. لاحظي كيف تتقارب النقاط عند طرفي الحركة الناعمة.</p>
</div>
<h3>لماذا تبدو الحركة الناعمة طبيعية؟</h3>
<p>لا شيء في الطبيعة يبدأ أو يتوقف فجأة. السيارة تتسارع تدريجيًا وتتباطأ قبل التوقف، والكرة تتباطأ قبل أن تصل إلى أعلى نقطة. عيوننا اعتادت هذا، فعندما يتحرك عنصر بسرعة ثابتة ثم يتوقف فجأة، نشعر أن شيئًا «غير صحيح».</p>
<h3>أنواع التسارع</h3>
<ul><li><b>Ease Out (تباطؤ في النهاية):</b> العنصر يدخل بسرعة ويهدأ عند وصوله. الأنسب للعناصر التي تدخل الشاشة.</li><li><b>Ease In (تسارع في البداية):</b> العنصر يبدأ ببطء ثم يسرع ويخرج. الأنسب للعناصر التي تغادر الشاشة.</li><li><b>Ease In/Out:</b> بطء في البداية والنهاية. الأنسب للعناصر التي تتحرك من مكان لآخر داخل الشاشة.</li></ul>
<h3>مبادئ حركة إضافية</h3>
<details class="acc"><summary>التحضير (Anticipation)</summary><p>حركة صغيرة معاكسة قبل الحركة الأساسية، كما يثني الشخص ركبتيه قبل القفز. في الموشن: الزر يصغر قليلًا قبل أن يقفز ويكبر. يجعل الحركة أوضح وأكثر حيوية.</p></details>
<details class="acc"><summary>التجاوز والارتداد (Overshoot)</summary><p>العنصر يتجاوز موضعه النهائي قليلًا ثم يرتد إليه، كأنه مرن. يعطي إحساسًا مرحًا وحيويًا. مناسب للأيقونات والأزرار، وأقل مناسبة للمحتوى الرسمي.</p></details>
<details class="acc"><summary>التدرّج (Stagger)</summary><p>بدل أن تظهر خمس أيقونات معًا، تظهر واحدة تلو الأخرى بفارق قصير. يقود عين المشاهد ويعطي إيقاعًا جميلًا. سنعود إليه في صفحة التوقيت.</p></details>
<h3>كيف أطبّق التسارع في الأدوات؟</h3>
<ul><li><b>After Effects:</b> حدّدي الإطارات المفتاحية واضغطي F9 لتطبيق Easy Ease. وللتحكم الدقيق، افتحي محرر المنحنيات (Graph Editor).</li><li><b>CapCut:</b> بعد إضافة إطارين مفتاحيين، تتيح الإصدارات الحديثة اختيار منحنى للحركة بين الإطارات، ابحثي عن خيار المنحنيات (Graphs) عند تحديد الإطار المفتاحي.</li><li><b>Canva:</b> الحركات الجاهزة فيها تسارع ناعم افتراضيًا، فاختاري الحركات الهادئة مثل الارتفاع (Rise) والتلاشي (Fade) للمحتوى المهني.</li></ul>
`});

P({ m: 4, t: 'ضبط التوقيت (Timing)', min: 6, h: `
<p class="lead">التوقيت هو كم تستغرق الحركة، ومتى تبدأ مقارنة بغيرها. الحركة نفسها بتوقيتين مختلفين تعطي إحساسين مختلفين تمامًا.</p>
<div class="stats">
  <div><b class="mono">0.3–0.6 ث</b><span>مدة مناسبة لدخول عنصر أو خروجه في أغلب الحالات</span></div>
  <div><b>قراءتان</b><span>اتركي النص على الشاشة وقتًا يكفي لقراءته بصوت عالٍ مرتين</span></div>
  <div><b>عنصر واحد</b><span>يتحرك في كل لحظة ليقود العين، ثم الذي يليه</span></div>
</div>
<p class="muted">هذه أرقام إرشادية لا قواعد صارمة. عينك وأذنك هما الحكم النهائي.</p>
<h3>التوقيت يصنع الشخصية</h3>
<p>حركة سريعة وحادة (0.2 – 0.3 ثانية) تعني طاقة وحماسًا وشبابًا، وتناسب الإعلانات والريلز. حركة بطيئة وناعمة (0.8 – 1.2 ثانية) تعني هدوءًا وفخامة وثقة، وتناسب المنتجات الفاخرة والمحتوى الرسمي. اختاري توقيتًا يناسب شخصية العلامة، والتزمي به في الفيديو كله.</p>
<h3>خمس قواعد للتوقيت</h3>
<ol class="nums">
  <li><b>التدرّج (Stagger):</b> أدخلي العناصر المتشابهة واحدًا تلو الآخر بفارق 0.05 – 0.15 ثانية تقريبًا، بدل ظهورها معًا.</li>
  <li><b>التزامن مع الصوت:</b> ضربات الموسيقى نقاط مثالية للإطارات المفتاحية. عندما يظهر العنوان مع الضربة، يشعر المشاهد بالتناغم.</li>
  <li><b>لحظة سكون:</b> بعد كل رسالة مهمة، اتركي العناصر ثابتة لحظة ليستوعبها المشاهد قبل الحركة التالية.</li>
  <li><b>النص يحتاج وقتًا:</b> الخطأ الأشهر عند المبتدئات نص يختفي قبل أن يُقرأ. طبّقي قاعدة «القراءتين».</li>
  <li><b>راجعي بالسرعة الطبيعية:</b> لا تحكمي على التوقيت بتقليب الإطارات واحدًا واحدًا. شاهدي المقطع كاملًا بالسرعة العادية عدة مرات.</li>
</ol>
<div class="callout warn"><b>الخطأ الشائع</b>تحريك كل العناصر في اللحظة نفسها. العين لا تعرف أين تنظر، فتتشتت وتتعب. عنصر واحد يقود في كل لحظة.</div>
`});

P({ m: 4, t: 'الانتقالات (Transitions)', min: 6, h: `
<p class="lead">الانتقال هو طريقة الانتقال من لقطة أو مشهد إلى الذي يليه. الانتقال الجيد يخدم القصة، والانتقال السيئ يلفت الانتباه إلى نفسه.</p>
<div class="scroll"><table class="tbl">
<thead><tr><th>الانتقال</th><th>ماذا يحدث؟</th><th>متى نستخدمه؟</th></tr></thead>
<tbody>
<tr><td><b>القطع المباشر</b><br><span class="en">CUT</span></td><td>اللقطة تنتهي والتالية تبدأ فورًا</td><td>في أغلب الأحيان. هو الانتقال الأساسي وغير الملحوظ</td></tr>
<tr><td><b>الذوبان والتلاشي</b><br><span class="en">DISSOLVE · FADE</span></td><td>لقطة تختفي تدريجيًا وتظهر الأخرى، أو تتلاشى إلى الأسود</td><td>مرور الزمن، لحظات هادئة وعاطفية، بداية الفيديو ونهايته</td></tr>
<tr><td><b>القطع المتطابق</b><br><span class="en">MATCH CUT</span></td><td>شكل أو حركة في لقطة يكمل في اللقطة التالية</td><td>ربط بصري ذكي بين فكرتين، كالمحفظة المتحركة التي تصبح حقيقية</td></tr>
<tr><td><b>المسح والانزلاق</b><br><span class="en">WIPE · SLIDE</span></td><td>عنصر أو شكل يعبر الشاشة ويكشف المشهد التالي</td><td>شائع في الموشن، مناسب للقوائم وتعداد النقاط</td></tr>
<tr><td><b>التكبير والحركة السريعة</b><br><span class="en">ZOOM · WHIP</span></td><td>حركة سريعة جدًا مع ضبابية تنقلنا للمشهد التالي</td><td>طاقة عالية في الإعلانات والريلز</td></tr>
<tr><td><b>انتقال الأقنعة</b><br><span class="en">MASK TRANSITION</span></td><td>شكل (دائرة، مربع، حرف) يكبر ليحتوي المشهد الجديد</td><td>أسلوب موشن احترافي، ممتاز لربط الشعار بالمحتوى</td></tr>
</tbody></table></div>
<h3>ثلاث قواعد للانتقالات</h3>
<ol class="nums"><li><b>القطع أولًا.</b> أغلب الانتقالات في الأفلام والإعلانات قطع مباشر. استخدمي الانتقالات الأخرى لسبب.</li><li><b>أسلوب أو اثنان فقط.</b> اختاري انتقالًا مميزًا واحدًا أو اثنين، وكرّريهما في الفيديو. التكرار يصنع أسلوبًا، والعشوائية تصنع فوضى.</li><li><b>خطّطي له مسبقًا.</b> القطع المتطابق وانتقال الأقنعة يحتاجان تخطيطًا في الستوري بورد، لأن اللقطتين يجب أن تُصمَّما أو تُصوَّرا بطريقة تسمح بالربط.</li></ol>
<div class="callout tip"><b>تحدٍّ لمشروعك</b>جرّبي قطعًا متطابقًا واحدًا أو انتقال أقنعة واحدًا في مشروعك النهائي. هذان الانتقالان تحديدًا هما ما يعطي الفيديو الطابع الاحترافي.</div>
`});

P({ m: 4, t: 'النص المتحرك على الشاشة', min: 5, h: `
<p class="lead">كثير من المشاهدين يشاهدون الفيديو دون صوت. النص على الشاشة ليس زينة، بل جزء أساسي من الرسالة.</p>
<h3>قواعد النص المقروء</h3>
<ul>
  <li><b>كلمات قليلة:</b> جملة قصيرة أو عبارة، لا فقرة. إن احتجتِ إلى أكثر، قسّميها على عدة شاشات.</li>
  <li><b>حجم كبير:</b> تذكري أن الفيديو يُشاهد على شاشة هاتف صغيرة.</li>
  <li><b>تباين واضح:</b> نص فاتح على خلفية داكنة أو العكس. إذا كانت الخلفية صورة متحركة، ضعي خلف النص شريطًا أو ظلًا خفيفًا.</li>
  <li><b>خطّان كحد أقصى:</b> خط للعناوين وخط للنصوص، ويجب أن يدعم الخط العربي بشكل جيد.</li>
  <li><b>اتجاه الحركة:</b> النص العربي يُقرأ من اليمين، فحركة دخوله من اليمين إلى اليسار أكثر طبيعية للقارئ العربي.</li>
</ul>
<h3>الترجمة النصية (Captions)</h3>
<p>إذا كان في الفيديو تعليق صوتي، أضيفي ترجمة نصية له. أدوات مثل CapCut تولّد الترجمة تلقائيًا، لكن راجعيها كلمة كلمة، فالتعرف التلقائي على العربية يخطئ أحيانًا في الكلمات والتشكيل.</p>
<h3>الطباعة الحركية (Kinetic Typography)</h3>
<p>أسلوب موشن كامل مبني على تحريك الكلمات نفسها: تظهر الكلمة المهمة أكبر، أو بلون مختلف، أو مع الضربة الموسيقية، أو تتحرك بطريقة تعبّر عن معناها (كلمة «سريع» تدخل بسرعة، وكلمة «هدوء» تظهر ببطء). من أبسط أساليب الموشن تنفيذًا وأكثرها تأثيرًا، ويمكن تطبيقه بالكامل في CapCut أو Canva.</p>
<div class="callout tip"><b>اختبار الهاتف</b>قبل أن تعتمدي أي نص، شاهدي الفيديو على هاتفك، على مسافة ذراع، وبسرعة عادية. هل قرأتِ كل نص بسهولة؟</div>
`});

P({ m: 4, t: 'التطبيق العملي في الأدوات', min: 10, h: `
<p class="lead">اختاري الأداة التي تناسبك واتبعي خطواتها لصنع أول حركة بإطارات مفتاحية. واجهات التطبيقات تتغير مع التحديثات، فإن لم تجدي زرًا باسمه، ابحثي عن رمزه.</p>
<div class="tabs">
  <div class="tablist" role="tablist"><button role="tab" aria-selected="true">CapCut</button><button role="tab">Canva</button><button role="tab">After Effects</button></div>
  <div class="tabpanel">

    <h4>تحريك نص بإطارات مفتاحية</h4>

function partnersHTML(){return partnerOrder.map(([k,alt,cls])=>`<img src="${LOGOS[k]}" alt="${alt}" class="${cls||''}">`).join('');}
document.getElementById('sidePartners').innerHTML=partnersHTML();

/* ---------- SCORM 1.2 ---------- */
const SC={api:null,start:Date.now()};
function findAPI(w){let n=0;while(w&&!w.API&&w.parent&&w.parent!==w&&n<10){w=w.parent;n++;}return w&&w.API?w.API:null;}
try{SC.api=findAPI(window)||(window.opener?findAPI(window.opener):null);}catch(e){SC.api=null;}
function sget(k){try{return SC.api?SC.api.LMSGetValue(k):'';}catch(e){return '';}}
function sset(k,v){try{if(SC.api)SC.api.LMSSetValue(k,String(v));}catch(e){}}
function scommit(){try{if(SC.api)SC.api.LMSCommit('');}catch(e){}}
if(SC.api){try{SC.api.LMSInitialize('');}catch(e){}}

/* ---------- state ---------- */
let S={v:'',f:null,l:0};
(function load(){
  let raw='';
  if(SC.api){raw=sget('cmi.suspend_data');const loc=sget('cmi.core.lesson_location');if(loc)S.l=+loc||0;}
  else{try{raw=localStorage.getItem('mm002_state')||'';}catch(e){}}
  try{if(raw){const o=JSON.parse(raw);S=Object.assign(S,o);}}catch(e){}
  if(SC.api){const st=sget('cmi.core.lesson_status');if(st==='not attempted'||!st)sset('cmi.core.lesson_status','incomplete');}
})();
function save(){
  const data=JSON.stringify(S);
  if(SC.api){sset('cmi.suspend_data',data);sset('cmi.core.lesson_location',S.l);scommit();}
  else{try{localStorage.setItem('mm002_state',data);}catch(e){}}
}
const seen=i=>S.v[i]==='1';
function markSeen(i){let a=S.v.padEnd(PAGES.length,'0').split('');a[i]='1';S.v=a.join('');}

/* ---------- TOC ---------- */
const toc=document.getElementById('toc');
function buildTOC(){
  let html='',cur=-1;
  PAGES.forEach((p,i)=>{
    if(p.m!==cur){cur=p.m;const cnt=PAGES.filter(x=>x.m===cur).reduce((s,x)=>s+(x.min||0),0);html+=`<h4 style="--c:${MODS[cur].c}">${MODS[cur].n}<small>${cnt} د</small></h4>`;}
    html+=`<button data-i="${i}" style="--c:${MODS[p.m].c}"><span class="dot"></span><span>${p.t}${p.type&&KIND[p.type]?`<span class="kind">${KIND[p.type]}</span>`:''}</span></button>`;
  });
  toc.innerHTML=html;
  toc.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{go(+b.dataset.i);closeMenu();}));
}
function refreshTOC(){
  toc.querySelectorAll('button').forEach(b=>{const i=+b.dataset.i;b.classList.toggle('seen',seen(i));if(i===S.l)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');});
  const n=PAGES.filter((_,i)=>seen(i)).length, pct=Math.round(n/PAGES.length*100);
  document.getElementById('progFill').style.width=pct+'%';document.getElementById('progTxt').textContent=pct+'%';
  const st=document.getElementById('status');
  if(S.f){const ok=S.f>=PASS;st.textContent=(ok?'ناجحة':'لم تجتز بعد')+' · '+S.f+'%';st.className='status '+(ok?'passed':'failed');}
  else{st.textContent='قيد التعلّم';st.className='status';}
}

/* ---------- quiz rendering ---------- */
function qHTML(qs,prefix,withCheck){
  return qs.map((q,qi)=>`<div class="q" data-q="${qi}"><h3><span class="n">${String(qi+1).padStart(2,'0')}</span>${q.q}</h3>
  ${q.o.map((o,oi)=>`<label class="opt"><input type="radio" name="${prefix}${qi}" value="${oi}"><span class="ol">${'أبجد'[oi]})</span><span>${o}</span></label>`).join('')}
  ${withCheck?`<div class="qactions"><button type="button" class="btn alt chk">تحقّقي من إجابتك</button></div><div class="fb" hidden></div>`:''}</div>`).join('');
}
function wireKC(root,qs){
  root.querySelectorAll('.q').forEach(el=>{
    const qi=+el.dataset.q,q=qs[qi],fb=el.querySelector('.fb');
    el.querySelector('.chk').addEventListener('click',()=>{
      const sel=el.querySelector('input:checked');
      el.querySelectorAll('.opt').forEach(o=>o.classList.remove('right','wrong'));
      if(!sel){fb.hidden=false;fb.className='fb';fb.innerHTML='<b>اختاري إجابة أولًا.</b>';return;}
      const v=+sel.value,ok=v===q.a;
      el.querySelectorAll('.opt')[q.a].classList.add('right');
      if(!ok)sel.closest('.opt').classList.add('wrong');
      fb.hidden=false;fb.className='fb '+(ok?'ok':'no');
      fb.innerHTML=`<b>${ok?'إجابة صحيحة.':'ليست الإجابة الصحيحة.'}</b>${q.f||''}`;
    });
  });
}
function lvl(v){return LEVELS.find(l=>v>=l.min);}
function scoreBy(qs,ans){const per={};SECTIONS.forEach(k=>per[k]=[0,0]);let r=0;qs.forEach((q,i)=>{per[q.m][1]++;if(ans[i]===q.a){per[q.m][0]++;r++;}});return {s:Math.round(r/qs.length*100),r,m:SECTIONS.map(k=>Math.round(per[k][0]/per[k][1]*100))};}
function recordInteractions(prefix,qs,ans){
  if(!SC.api)return;
  let n=parseInt(sget('cmi.interactions._count'),10);if(isNaN(n))n=0;
  const L='abcd';
  qs.forEach((q,i)=>{const k='cmi.interactions.'+(n+i)+'.';sset(k+'id',prefix+'_q'+String(i+1).padStart(2,'0'));sset(k+'type','choice');sset(k+'objectives.0.id','M'+q.m);sset(k+'correct_responses.0.pattern',L[q.a]);sset(k+'student_response',L[ans[i]]);sset(k+'result',ans[i]===q.a?'correct':'wrong');sset(k+'weighting','1');});
}
function collect(box,qs,pfx){return qs.map((q,qi)=>{const s=box.querySelector(`input[name="${pfx}${qi}"]:checked`);return s?+s.value:-1;});}
function quizForm(box,qs,pfx,label,onSubmit){
  box.innerHTML=qHTML(qs.map(q=>({q:`<span class="qmod">${MOD_NAMES[q.m]}</span>${q.q}`,o:q.o})),pfx,false)+`<div class="qactions"><button type="button" class="btn" id="submitT">${label}</button><span class="muted" id="tHint"></span></div>`;
  box.querySelector('#submitT').addEventListener('click',()=>{const ans=collect(box,qs,pfx);const miss=ans.filter(a=>a<0).length;if(miss){box.querySelector('#tHint').textContent=`بقي ${miss} ${miss===1?'سؤال':miss<=10?'أسئلة':'سؤالًا'} دون إجابة.`;const f=ans.findIndex(a=>a<0);box.querySelector(`.q[data-q="${f}"]`).scrollIntoView({behavior:'smooth',block:'center'});return;}onSubmit(ans);});
}
function modRows(pre,post){
  return SECTIONS.map((sec,i)=>{
    const a=pre?pre.m[i]:null,b=post?post.m[i]:null;
    const bar=(v,cls,lab)=>`<div class="bar-row"><span class="bl">${lab}</span><div class="bt"><div class="bf ${cls}" style="width:${Math.max(v,2)}%" title="${lab}: ${v}%"></div></div><span class="bv mono">${v}%</span></div>`;
    return `<div class="mrow"><div class="mname"><b>${MOD_NAMES[sec]}</b>${post?`<span class="delta ${b-a>=0?'up':'down'} mono">${b-a>=0?'+':''}${b-a}</span>`:`<span class="lv ${lvl(a).tone}">${lvl(a).name}</span>`}</div>${a!==null?bar(a,'pre','قبلي'):''}${b!==null?bar(b,'post','بعدي'):''}${!post?`<p class="adv">${ADVICE[lvl(a).tone]}</p>`:''}</div>`;
  }).join('');
}
function firstPageOf(m){return PAGES.findIndex(x=>x.m===m);}
function wirePre(root){
  const box=root.querySelector('#testBox');
  function results(){
    const P0=S.pre,L=lvl(P0.s);
    const weakest=SECTIONS[P0.m.indexOf(Math.min(...P0.m))];
    box.innerHTML=`<div class="result"><p class="muted" style="margin:0">نتيجة الاختبار القبلي · ${P0.r} من ${PRE_QS.length}</p><div class="big mono">${P0.s}%</div><p>مستواك العام: <span class="lv ${L.tone}">${L.name}</span></p><p class="muted">هذه النتيجة لا تُحتسب في درجتك. ستُقارن بنتيجة الاختبار البعدي لقياس تقدّمك.</p></div>
    <h3>مستواك في كل محور</h3><div class="legend2"><span><i class="pre"></i>الاختبار القبلي</span></div><div class="mods">${modRows(P0,null)}</div>
    <div class="callout key"><b>من أين تبدئين؟</b>أقل نتيجة لديك في محور «${MOD_NAMES[weakest]}». ننصحك بإعطائه وقتًا أطول. ومع ذلك، تابعي المساق بالترتيب، فكل وحدة تبني على التي قبلها.</div>
    <div class="qactions"><button type="button" class="btn" id="goStart">ابدئي المساق</button></div>`;
    box.querySelector('#goStart').onclick=()=>go(S.l+1);
  }
  if(S.pre){results();return;}
  quizForm(box,PRE_QS,'pre','سلّمي الاختبار القبلي',ans=>{
    const r=scoreBy(PRE_QS,ans);S.pre={s:r.s,r:r.r,m:r.m};
    recordInteractions('pre',PRE_QS,ans);save();refreshTOC();results();box.scrollIntoView({behavior:'smooth'});
  });
}
function wirePost(root){
  const box=root.querySelector('#testBox');
  const preIdx=PAGES.findIndex(x=>x.type==='pre');
  if(!S.pre){box.innerHTML=`<div class="callout warn"><b>أدّي الاختبار القبلي أولًا</b>لقياس تقدّمك، نحتاج إلى نتيجتك في بداية المساق. أدّي الاختبار القبلي، ثم عودي إلى هنا.</div><button type="button" class="btn" id="goPre">انتقلي إلى الاختبار القبلي</button>`;box.querySelector('#goPre').onclick=()=>go(preIdx);return;}
  function results(fresh){
    const A=S.pre,B=S.post,pass=B.s>=PASS,diff=B.s-A.s,gain=A.s<100?Math.round(diff/(100-A.s)*100):0;
    box.innerHTML=`<div class="result ${pass?'pass':'fail'}"><p class="muted" style="margin:0">نتيجة الاختبار البعدي${fresh?'':' (آخر محاولة)'} · ${B.r} من ${POST_QS.length}</p><div class="big mono">${B.s}%</div><p><b>${pass?'مبروك، اجتزتِ الاختبار البعدي.':'لم تصلي بعد إلى درجة النجاح (70%).'}</b> ${pass?'':'راجعي المحاور التي انخفضت فيها نتيجتك، ثم أعيدي المحاولة.'}</p>${S.f!==B.s?`<p class="muted">أعلى درجة مسجّلة لك: ${S.f}%</p>`:''}</div>
    <div class="kpis"><div><span>قبل المساق</span><b class="mono">${A.s}%</b></div><div><span>بعد المساق</span><b class="mono">${B.s}%</b></div><div><span>مقدار التقدّم</span><b class="mono">${diff>=0?'+':''}${diff}</b><small>نقطة مئوية</small></div><div><span>نسبة ما اكتسبتِه</span><b class="mono">${Math.max(gain,0)}%</b><small>من المساحة المتاحة للتحسّن</small></div></div>
    <h3>تقدّمك في كل محور</h3><div class="legend2"><span><i class="pre"></i>الاختبار القبلي</span><span><i class="post"></i>الاختبار البعدي</span></div><div class="mods">${modRows(A,B)}</div>
    <p class="muted">«نسبة ما اكتسبتِه» = (البعدي − القبلي) ÷ (100 − القبلي). تقيس كم تحسّنتِ مقارنة بما كان متاحًا لك أن تتعلميه.</p>
    <div class="qactions"><button type="button" class="btn alt" id="retry">${pass?'إعادة الاختبار':'أعيدي المحاولة'}</button>${fresh?'<button type="button" class="btn alt" id="review">راجعي إجاباتك</button>':''}</div><div id="reviewBox"></div>`;
    box.querySelector('#retry').onclick=()=>{form();box.scrollIntoView({behavior:'smooth'});};
    const rv=box.querySelector('#review');
    if(rv)rv.onclick=()=>{const rb=box.querySelector('#reviewBox');rb.innerHTML=qHTML(POST_QS.map(q=>({q:`<span class="qmod">${MOD_NAMES[q.m]}</span>${q.q}`,o:q.o})),'rv',false);POST_QS.forEach((q,qi)=>{const el=rb.querySelector(`.q[data-q="${qi}"]`),o=el.querySelectorAll('.opt'),a=S.lastAns[qi];o[q.a].classList.add('right');if(a!==q.a)o[a].classList.add('wrong');el.querySelectorAll('input').forEach((x,xi)=>{x.disabled=true;x.checked=xi===a;});});rv.remove();};
  }
  function form(){
    quizForm(box,POST_QS,'post','سلّمي الاختبار البعدي',ans=>{
      const r=scoreBy(POST_QS,ans);S.post={s:r.s,r:r.r,m:r.m};S.lastAns=ans;S.f=Math.max(S.f||0,r.s);
      recordInteractions('post',POST_QS,ans);
      if(SC.api){sset('cmi.core.score.min',0);sset('cmi.core.score.max',100);sset('cmi.core.score.raw',S.f);sset('cmi.core.lesson_status',S.f>=PASS?'passed':'failed');}
      save();refreshTOC();results(true);box.scrollIntoView({behavior:'smooth'});
    });
  }
  if(S.post)results(false);else form();
}

/* ---------- page render ---------- */
const pageEl=document.getElementById('page'), mainEl=document.getElementById('main');
function go(i){
  i=Math.max(0,Math.min(PAGES.length-1,i));S.l=i;markSeen(i);
  const p=PAGES[i],M=MODS[p.m];
  const inMod=PAGES.filter(x=>x.m===p.m),pos=inMod.indexOf(p)+1;
  let body=p.h||'';
  if(i===0)body=`<p class="partners-cap">بالشراكة مع</p><div class="partners welcome-partners">${partnersHTML()}</div>`+body;
  if(i===PAGES.length-1)body+=`<div class="partners" style="margin-top:28px">${partnersHTML()}</div>`;
  if(p.type==='kc')body=`<p class="lead">أجيبي عن الأسئلة التالية واضغطي «تحقّقي من إجابتك» بعد كل سؤال. هذا الاختبار للتدريب ولا يُحتسب في الدرجة.</p>`+qHTML(p.qs,'k'+i+'_',true);
  if(p.type==='pre'||p.type==='post')body+=`<div id="testBox"></div>`;
  pageEl.style.setProperty('--c',M.c);
  pageEl.innerHTML=`<div class="phead"><span class="chip" style="--c:${M.c}">${M.n}</span><span>الصفحة ${pos} من ${inMod.length}</span>${p.type&&KIND[p.type]?`<span>· ${KIND[p.type]}</span>`:''}<span class="mins">${p.min||1} د</span></div>
  <h2 class="ptitle">${p.t}</h2><div class="content">${body}</div>
  <div class="pnav"><button type="button" class="btn alt" id="prev" ${i===0?'disabled':''}>→ السابق</button><span class="count">${i+1} / ${PAGES.length}</span><button type="button" class="btn" id="next" ${i===PAGES.length-1?'disabled':''}>التالي ←</button></div>`;
  pageEl.querySelector('#prev').onclick=()=>go(i-1);
  pageEl.querySelector('#next').onclick=()=>go(i+1);
  wire(pageEl,p);
  mainEl.scrollTop=0;
  if(SC.api&&!S.f&&S.v.replace(/0/g,'').length>=PAGES.length){/* all seen but final not passed: keep incomplete */}
  save();refreshTOC();
  const h=pageEl.querySelector('.ptitle');if(h){h.setAttribute('tabindex','-1');}
}
function wire(root,p){
  root.querySelectorAll('.tabs').forEach(t=>{const bs=[...t.querySelectorAll('[role=tab]')],ps=[...t.querySelectorAll('.tabpanel')];bs.forEach((b,k)=>{b.addEventListener('click',()=>{bs.forEach((x,j)=>x.setAttribute('aria-selected',String(j===k)));ps.forEach((x,j)=>x.hidden=j!==k);});});});
  root.querySelectorAll('.ba').forEach(b=>{const btn=b.querySelector('.ba-btn'),a=b.querySelector('.ba-after');btn.addEventListener('click',()=>{a.hidden=false;btn.hidden=true;});});
  root.querySelectorAll('.chips[data-reflect]').forEach(c=>{const out=root.querySelector(`.reveal-after[data-for="${c.dataset.reflect}"]`);c.querySelectorAll('button').forEach(b=>{b.setAttribute('aria-pressed','false');b.addEventListener('click',()=>{b.setAttribute('aria-pressed',String(b.getAttribute('aria-pressed')!=='true'));if(out)out.hidden=!c.querySelector('[aria-pressed="true"]');});});});
  root.querySelectorAll('.lane[data-ease]').forEach(l=>{const f=l.dataset.ease==='lin'?t=>t:t=>0.5-0.5*Math.cos(Math.PI*t);for(let k=0;k<9;k++){const d=document.createElement('span');d.className='ghost'+(k===0||k===8?' key':'');d.style.left=(f(k/8)*100)+'%';l.appendChild(d);}});
  if(p.type==='kc')wireKC(root,p.qs);
  if(p.type==='pre')wirePre(root);
  if(p.type==='post')wirePost(root);
}

/* ---------- menu & keys ---------- */
const side=document.getElementById('side'),menuBtn=document.getElementById('menuBtn');
function closeMenu(){side.classList.remove('open');menuBtn.setAttribute('aria-expanded','false');}
menuBtn.addEventListener('click',()=>{const o=side.classList.toggle('open');menuBtn.setAttribute('aria-expanded',String(o));});
document.addEventListener('keydown',e=>{if(e.target.closest('input,textarea,[role=tab]'))return;if(e.altKey&&e.key==='ArrowLeft')go(S.l+1);if(e.altKey&&e.key==='ArrowRight')go(S.l-1);if(e.key==='Escape')closeMenu();});

/* ---------- finish ---------- */
function fmtTime(ms){const s=Math.floor(ms/1000),h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return String(h).padStart(4,'0')+':'+String(m).padStart(2,'0')+':'+String(x).padStart(2,'0');}
let finished=false;
function finish(){if(finished||!SC.api)return;finished=true;sset('cmi.core.session_time',fmtTime(Date.now()-SC.start));sset('cmi.core.exit','suspend');save();try{SC.api.LMSFinish('');}catch(e){}}
window.addEventListener('pagehide',finish);window.addEventListener('beforeunload',finish);

buildTOC();go(Math.min(S.l||0,PAGES.length-1));
})();
</script>
</body>
